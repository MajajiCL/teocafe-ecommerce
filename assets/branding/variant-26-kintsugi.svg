<?xml version="1.0" encoding="UTF-8"?>
<svg width="1080" height="1080" viewBox="0 0 1080 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&amp;display=swap');
      .v26-title { font-family: 'Montserrat', sans-serif; font-weight: 400; letter-spacing: 20px; font-size: 44px; fill: url(#titleGrad26); }
      .v26-sub { font-family: 'Montserrat', sans-serif; font-weight: 400; letter-spacing: 6.5px; font-size: 14px; fill: #FDE68A; }
    </style>
    <radialGradient id="bgGrad26" cx="50%" cy="42%" r="66%">
      <stop offset="0%" stop-color="#120E0A" /><stop offset="55%" stop-color="#080605" /><stop offset="100%" stop-color="#020101" />
    </radialGradient>
    <linearGradient id="goldGrad26" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" /><stop offset="30%" stop-color="#FCD34D" /><stop offset="65%" stop-color="#F59E0B" /><stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <!-- Oro de la reparacion: en userSpaceOnUse para que las tres vetas compartan
         una misma luz, en vez de que cada trazo repita el degradado y se apague.
         OJO: con userSpaceOnUse las coordenadas son las del elemento que lo usa,
         o sea las del grupo ya trasladado a 540,430: locales, no de lienzo. Con
         coordenadas de lienzo el eje cae fuera del dibujo, todo se queda clavado
         en el primer stop y las vetas salen blancas en vez de doradas. -->
    <linearGradient id="veinGold26" gradientUnits="userSpaceOnUse" x1="-160" y1="-200" x2="160" y2="190">
      <stop offset="0%" stop-color="#FFFBEB" /><stop offset="12%" stop-color="#FDE68A" /><stop offset="35%" stop-color="#FCD34D" /><stop offset="68%" stop-color="#F59E0B" /><stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="titleGrad26" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFBEB" /><stop offset="50%" stop-color="#FDE68A" /><stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bgGrad26)" />

  <!-- ISOTIPO KINTSUGI: chawan asimetrico, roto y vuelto a unir con oro -->
  <g transform="translate(540, 430)">

    <!-- Hueco del cuenco: el vacio que respira -->
    <path d="M -200,-62 C -170,-106 -40,-124 60,-120 C 130,-117 180,-100 196,-78 C 182,-44 132,-12 62,-9 C -40,-5 -168,-22 -200,-62 Z" fill="#050403" />

    <!-- Silueta ceramica: pared, pie y pared. Hairline, porque la pieza calla -->
    <path d="M -200,-62 C -198,32 -164,114 -84,146 C -70,151 -62,151 -56,152 L -50,178 C -48,183 -44,184 -38,184 L 36,185 C 42,185 46,183 47,178 L 52,152 C 60,151 70,150 80,146 C 158,108 194,26 196,-78" stroke="url(#goldGrad26)" stroke-width="1.9" stroke-opacity="0.62" stroke-linejoin="round" fill="none" />

    <!-- Canto posterior (recibe la luz) y canto interior frontal -->
    <path d="M -200,-62 C -170,-106 -40,-124 60,-120 C 130,-117 180,-100 196,-78" stroke="url(#goldGrad26)" stroke-width="2.3" stroke-opacity="0.78" fill="none" />
    <path d="M -200,-62 C -168,-22 -40,-5 62,-9 C 132,-12 182,-44 196,-78" stroke="url(#goldGrad26)" stroke-width="1.5" stroke-opacity="0.58" fill="none" />

    <!-- Reflejo en la pared interior: asimetrico, solo a un lado -->
    <path d="M -166,-52 C -148,-30 -116,-15 -80,-10" stroke="#FDE68A" stroke-width="2" stroke-opacity="0.3" stroke-linecap="round" fill="none" />
    <path d="M 96,-30 C 110,-38 120,-48 126,-58" stroke="#FDE68A" stroke-width="1.4" stroke-opacity="0.22" stroke-linecap="round" fill="none" />

    <!-- VETA MAESTRA: del canto frontal al pie. Grosor variable: es un relleno,
         no un stroke, porque una grieta real no tiene grosor constante -->
    <path d="M -56,-10 C -44,20 -38,28 -45,42 C -52,58 -60,64 -56,78 C -52,94 -28,98 -22,112 C -17,125 -28,134 -26,146 C -24,158 -8,160 2,172 C -6,156 -16,152 -16,145 C -16,133 -8,126 -13,111 C -19,96 -42,92 -46,78 C -50,64 -42,58 -35,42 C -29,28 -46,4 -56,-10 Z" fill="url(#veinGold26)" />
    <path d="M -56,-10 C -44,20 -38,28 -45,42 C -52,58 -60,64 -56,78 C -52,94 -28,98 -22,112 C -17,125 -28,134 -26,146 C -24,158 -8,160 2,172" stroke="#FFFBEB" stroke-width="1" stroke-opacity="0.3" stroke-linecap="round" fill="none" />

    <!-- VETA RAMIFICADA hacia el canto izquierdo -->
    <path d="M -45.7,52.6 C -62,47 -72,40 -82.9,32.4 C -95,24 -104,16 -114,8.2 C -126,-2 -140,-16 -150,-30 C -142,-12 -132,2 -122,15.8 C -112,25 -100,35 -87.1,43.6 C -74,52 -60,58 -50.3,61.4 Z" fill="url(#veinGold26)" />
    <path d="M -45.7,52.6 C -62,47 -72,40 -82.9,32.4 C -95,24 -104,16 -114,8.2 C -126,-2 -140,-16 -150,-30" stroke="#FFFBEB" stroke-width="0.9" stroke-opacity="0.22" stroke-linecap="round" fill="none" />

    <!-- VETA CORTA en la pared derecha: otra rotura, otro dia -->
    <path d="M 61.6,-8.2 C 69,1 76,13 81.5,24.7 C 90,32 103,35 111.1,40.8 C 115,49 119,59 123.8,67.5 C 133,74 144,80 152,84 C 145,75 137,67 132.2,60.5 C 128,52 124,43 116.9,35.2 C 109,29 96,25 90.5,15.3 C 85,5 74,-4 66.4,-11.8 Z" fill="url(#veinGold26)" />
    <path d="M 61.6,-8.2 C 69,1 76,13 81.5,24.7 C 90,32 103,35 111.1,40.8 C 115,49 119,59 123.8,67.5 C 133,74 144,80 152,84" stroke="#FFFBEB" stroke-width="0.9" stroke-opacity="0.24" stroke-linecap="round" fill="none" />

    <!-- Microfisuras capilares: el oro no llego a todas -->
    <path d="M -45,44 C -58,36 -70,28 -88,33" stroke="#D97706" stroke-width="1.4" stroke-opacity="0.52" stroke-linecap="round" fill="none" />
    <path d="M -23,113 C -8,106 4,102 20,110" stroke="#D97706" stroke-width="1.3" stroke-opacity="0.44" stroke-linecap="round" fill="none" />
    <path d="M 124,56 C 134,50 140,46 148,43" stroke="#D97706" stroke-width="1.2" stroke-opacity="0.42" stroke-linecap="round" fill="none" />

    <!-- KAKE: el desportillado del canto, rehecho en oro macizo. Cabalga el borde -->
    <path d="M -179,-77 C -172,-85 -160,-93 -146,-97 L -133,-96 L -142,-84 L -148,-68 L -162,-72 Z" fill="url(#veinGold26)" />
    <path d="M -160,-92 L -151,-80 L -148,-68" stroke="#080605" stroke-width="1.1" stroke-opacity="0.45" stroke-linejoin="round" fill="none" />
    <path d="M -148,-68 C -142,-56 -137,-44 -135,-31" stroke="#F59E0B" stroke-width="1.4" stroke-opacity="0.5" stroke-linecap="round" fill="none" />

    <!-- El oro asciende: la reparacion se vuelve aroma -->
    <path d="M 18,-122 C 28,-152 8,-176 18,-204 C 22,-220 20,-232 18,-244 C 24,-230 28,-216 26,-202 C 18,-174 38,-150 28,-122 Z" fill="url(#veinGold26)" />
    <path d="M -26,-119 C -20,-140 -26,-156 -18,-178 C -22,-156 -14,-140 -18,-119 Z" fill="url(#veinGold26)" opacity="0.72" />

    <!-- Pan de oro: escamas irregulares que derivan con el vapor -->
    <path d="M 38,-190 L 53,-197 L 59,-184 L 45,-177 Z" fill="#FDE68A" opacity="0.95" />
    <path d="M 56,-216 L 67,-219 L 70,-208 L 59,-205 Z" fill="#FCD34D" opacity="0.82" />
    <path d="M 29,-249 L 38,-251 L 40,-243 L 31,-241 Z" fill="#FDE68A" opacity="0.68" />
    <path d="M 73,-176 L 81,-178 L 83,-170 L 75,-168 Z" fill="#D97706" opacity="0.58" />
    <path d="M -40,-204 L -32,-207 L -29,-198 L -37,-195 Z" fill="#F59E0B" opacity="0.5" />
  </g>

  <!-- Tipografia discreta: manda la pieza, no la palabra -->
  <text x="550" y="758" text-anchor="middle" class="v26-title">TÉ O CAFÉ</text>

  <!-- Separador: la grieta otra vez, en miniatura -->
  <path d="M 418,795 C 450,790 480,797 508,793 C 480,800 450,793 418,798 Z" fill="url(#goldGrad26)" opacity="0.8" />
  <path d="M 662,795 C 630,790 600,797 572,793 C 600,800 630,793 662,798 Z" fill="url(#goldGrad26)" opacity="0.8" />
  <path d="M 536,789 L 545,791 L 543,799 L 534,797 Z" fill="#FDE68A" opacity="0.85" />

  <text x="543" y="832" text-anchor="middle" class="v26-sub">CAFÉ DE ORIGEN · TÉ DE CEILÁN</text>
</svg>
