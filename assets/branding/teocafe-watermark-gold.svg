    <circle cx="0" cy="0" r="202" stroke="url(#goldGradW1)" stroke-width="1.5" stroke-opacity="0.5" />
    
    <!-- Lado Izquierdo: Hoja Botánica de Té -->
    <path d="M 0,-180 C -120,-140 -160,-40 -160,20 C -160,110 -90,170 0,180 C -60,130 -80,50 -70,-20 C -60,-80 -25,-140 0,-180 Z" fill="url(#goldGradW1)" fill-opacity="0.9" />
    <path d="M 0,-160 Q -70, -20 0, 160" stroke="#000000" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M -25,-90 Q -65,-75 -105,-80" stroke="#000000" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M -38,-20 Q -85,-10 -125,-18" stroke="#000000" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M -28,50 Q -75,65 -110,55" stroke="#000000" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8" />

    <!-- Lado Derecho: Grano de Café Arábica -->
    <path d="M 0,-180 C 110,-150 175,-70 175,25 C 175,120 100,175 0,180 C 40,140 70,80 70,10 C 70,-60 35,-130 0,-180 Z" fill="url(#goldGradW1)" />
    <path d="M 0,-170 C 45,-100 50,-40 30,10 C 10,60 35,120 0,170" stroke="#000000" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.8" />
