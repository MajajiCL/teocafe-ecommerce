<?xml version="1.0" encoding="UTF-8"?>
<svg width="1080" height="1080" viewBox="0 0 1080 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&amp;family=Montserrat:wght@500;600;700&amp;display=swap');
      .wm-title { font-family: 'Cinzel', serif; font-weight: 700; letter-spacing: 16px; font-size: 56px; fill: url(#goldGradW1); }
      .wm-sub { font-family: 'Montserrat', sans-serif; font-weight: 600; letter-spacing: 9px; font-size: 17px; fill: #FDE68A; }
